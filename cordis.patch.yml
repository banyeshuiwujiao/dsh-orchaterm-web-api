# ============================================================================
# dsh-orchaterm-web-api —— 把 OrcaTerm (腾讯或壳终端) 反代接入模型选择器
# ============================================================================
# 注意：仅作为 provider 路由接入模型选择器，不加入工具列表。
#
# 本文件是本插件自带的 bundle patch（package.json 的 dsh.bundle.patch 指向它）。
#
# 接入步骤：
#   1. 执行 .\install.ps1（校验本机 Node.js、验证与 OrcaTerm 桌面端通信）
#   2. 确认 profile 的 dsh.profile.bundles 里列了 dsh-orchaterm-web-api
#   3. 重启 DeepSeek Harness 客户端
# ============================================================================

- insert:
    - id: dsh-orchaterm-web-api-provider
      name: dsh-orchaterm-web-api/provider
      config:
        # 只允许回环绑定：反代基于本机 OrcaTerm 登录态，对外开放等于泄露凭据
        baseUrl: 'http://127.0.0.1:8793'
        backendDir: ''
        nodePath: ''
        cgiBase: ''
        assistantBase: ''
        assistant: 'orcaterm'
        mode: 0
        # 以哪个客户端身份访问上游：'desktop'（origin/referer = http://tauri.localhost，桌面端真实页面）
        # 或 'web'（https://orcaterm.com）。实测上游两个通道都不校验这些头，这里只是身份对齐。
        clientIdentity: 'desktop'
        credentialsFile: ''
        cookies: ''
        assistantCookies: ''
        uin: ''
        skey: ''
        # AccessToken 自续期（v0.6.0）：'auto'（默认，临期自动续 + 5 分钟巡检）| 'off'。
        # 官方动作 OAuthRefreshToken；只要曾经登录过一次，之后不必一直开着 OrcaTerm 客户端。
        tokenRefresh: 'auto'
        # 续期结果缓存（含一枚 bearer token，0600 落盘）。默认 ~/.dsh/orca-token-cache.json。
        tokenCache: ''
        # 距过期不足 10 分钟就提前续期；后台每 5 分钟巡检一次（对齐桌面端 TokenManager）。
        tokenRefreshLeadMs: 600000
        tokenRefreshCheckMs: 300000
        autoStart: true
        startTimeoutMs: 20000
        probeTimeoutMs: 3000
        maxContextWindow: 128000
        defaultMaxTokens: 8192
        toolDescriptionMaxChars: 0
        healthTtlMs: 30000
        streamIdleTimeoutMs: 180000
        reuseConversation: true
        # 上游同一会话最多连续多少轮，超过就换新会话并补发 DSH 的历史（0 = 不限制）
        conversationMaxRounds: 40
        # 是否把 DSH 多轮历史发给上游：默认 false。上游会把它逐条回灌成 ai 帧污染正文，
        # 而它凭 conversationId 自己就能保住上下文。仅在对比排障时打开。
        sendHistoryMessages: false
        # 工具结果回传信封：'review'（默认，桌面端在用的形态）| 'ask'（主循环模块 2481 的形态）。
        # 两种都经真实流量验证能被上游消费；逐轮可用请求体 orca_result_envelope 覆盖。
        resultEnvelope: 'review'
        # 回传工具结果的「受理阶段」上限（官方 15e3）：只覆盖到「拿到响应头」，
        # 不约束随后的流式答案（把它当 AbortSignal 挂在整个请求上会掐断正常作答，见 README）。
        reportRetryTimeoutMs: 15000
        logFile: '~/.dsh/logs/orchaterm-web-api.log'
        detach: false
        killTreeOnDispose: true
        passEnvKeys: []
        env: {}
        strictBackend: true
        requiredCapabilities: []
        minBackendVersion: ''
        # 图片：上游助手网关只收文本，图片在宿主侧转述成文字再发出去。
        # assumeImageInput=true → 本路由的**所有**模型都申报可读图，
        # 带图会话才不会在宿主 admission 阶段被拒（MODEL_DOES_NOT_SUPPORT_IMAGES）。
        # 识图端点留空 = 读 ~/.dsh/.env 的 VISION_API_KEY / VISION_BASE_URL / VISION_MODEL
        # （与 dsh-vision 插件同一套）；没配就只给归一化副本的本地路径。
        assumeImageInput: true
        visionApiKey: ''
        visionBaseUrl: ''
        visionModel: ''
        visionTimeoutMs: 120000
        visionMaxTokens: 1024
        visionLang: 'zh'
